apiVersion: apps/v1
kind: Deployment
metadata:
  name: part3srv
  namespace: workshop
  labels:
    app: part3srv
spec:
  replicas: 1
  selector:
    matchLabels:
      app: part3srv
  template:
    metadata:
      labels:
        app: part3srv
    spec:
      containers:
        - name: part3srv
          image: workshop/part3srv:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
